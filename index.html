<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invito alla mia festa di compleanno</title>
    
    <link rel="stylesheet" href="styles.css">
    
    <!-- Font Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Courgette&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Sei invitato/a alla festa di compleanno di Marta!</h1>
         <div class="anni-row">
          &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<h1 class="anni">12</h1>
            <img src="capibara.png" height="150px" width="150px" class="capibara">
        </div>
        <p class="introduzione">
            Insieme ci divertiremo un mondo fra risate, torta e regali<br> Manchi solo tu! 
        </p>
        
        <section class="info-container">
            <article class="info-card">
                <p class="info-label">Quando?</p>
                <p class="info-value">la festa sarà <em>Lunedì 10 Agosto alle 20:30</em></p><!--orario e data da confermare-->
            </article>

            <article class="info-card">
                <p class="info-label">Dove?</p>
                <p class="info-value">ci vediamo da <em>Pistritto Smash Burger, Via Nettuno 27, Agrigento</em></p>
                
                <iframe
                    class="info-map"
                    src="https://www.google.com/maps?q=Pistritto+Smash+Burger+Via+Nettuno+27+Agrigento&output=embed"
                    width="100%"
                    height="200"
                    style="border:0;"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </article> 
        </section>

        <h2>Vi aspetto!</h2>
    </div>
    <audio id="musica-sfondo" loop>
    <source src="APT.mp3" type="audio/mpeg">
</audio>

<script>
    // Prova a far partire l'audio in automatico
    const audio = document.getElementById('musica-sfondo');
    audio.volume = 0.3;
    
    // Se l'autoplay automatico viene bloccato dal browser,
    // l'audio partirà al primo tocco o clic dell'utente sulla pagina
    document.addEventListener('click', function() {
        audio.play();
    }, { once: true }); // { once: true } fa eseguire il clic una sola volta
</script>
</body>
</html>
